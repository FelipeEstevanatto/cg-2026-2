<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Computação Gráfica - Semana 1</title>
</head>
<body class="flex justify-center bg-gray-200">
    <div class="bg-white p-2 sm:p-5 rounded mt-4 sm:min-w-xl text-center relative">
        <h1 class="text-3xl font-bold mb-4 mt-8">Computação Gráfica Semana 1</h1>
        <h2 class="text-xl">Desenhe uma flor, um robô e um carro.</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 flex gap-2 mt-8">
            <div class="text-center">
                <h3 class="text-xl font-semibold mb-1">Flor</h3>
                <canvas id="glCanvas1" width="300" height="300" class="rounded-md mx-auto"></canvas>
            </div>
            <div>
                <h3 class="text-xl font-semibold mb-1">Robo</h3>
                <canvas id="glCanvas2" width="300" height="300" class="rounded-md mx-auto"></canvas>
            </div>
            <div>
                <h3 class="text-xl font-semibold mb-1">Carro</h3>
                <canvas id="glCanvasFan" width="300" height="300" class="rounded-md mx-auto"></canvas>
            </div>
        </div>

        <a href="../index.html" class="absolute top-2 right-2 text-xl underline hover:text-blue-500">Voltar</a>
    </div>

    <!-- Load all JavaScript files -->
    <script src="flor.js"></script>
    <script src="robo.js"></script>
    <script src="carro.js"></script>
</body>
</html>
